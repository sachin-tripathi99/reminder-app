name: reminder_app
description: An interval-based alarm reminder application with ringer mode detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core functionality
  alarm: ^3.0.0
  sound_mode: ^2.0.3
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.2
  
  # State management
  provider: ^6.1.1
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Time handling
  intl: ^0.18.1
  timezone: ^0.9.2
  
  # Permissions
  permission_handler: ^11.0.1
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
